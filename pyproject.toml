[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipwatcher"
version = "0.1.0"
description = "Watches Twitch/Kick streams, finds moments from chat+audio, renders branded Shorts for team approval."
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.3",
  "pillow==13.0.0",
]

[project.optional-dependencies]
judge = ["anthropic==2.9.0", "faster-whisper==1.2.1"]
telegram = ["python-telegram-bot==22.8"]
publish = ["google-api-python-client==2.202.0", "google-auth-oauthlib==1.5.0"]
publish-browser = ["patchright==1.64.4"]
live = ["websockets==17.4"]
calibrate = ["mediapipe==1.2.3"]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipwatcher = ["ui/static/*", "ui/static/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs an ffmpeg build with libass (slow)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
